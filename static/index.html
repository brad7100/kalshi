<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arb Scanner">
<meta name="theme-color" content="#111827">
<title>Arb Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-24">

<header class="sticky top-0 z-30 bg-gray-800/95 backdrop-blur border-b border-gray-700 px-4 py-3 flex items-center justify-between">
  <div class="min-w-0">
    <div class="text-sm font-semibold">Arb Scanner — Kalshi ↔ Polymarket US</div>
    <div class="text-[11px] text-gray-400 num flex gap-2 flex-wrap">
      <span id="clock" class="text-white"></span>
      <span id="status">Loading…</span>
    </div>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <span id="dryRunBadge" class="hidden text-[10px] font-bold bg-yellow-600 text-black px-2 py-1 rounded">DRY-RUN</span>
    <button id="settingsBtn" class="bg-gray-700 active:bg-gray-600 px-3 py-2 rounded text-sm">⚙</button>
    <button id="refreshBtn" class="bg-blue-600 active:bg-blue-700 px-3 py-2 rounded text-sm font-medium">↻</button>
  </div>
</header>

<div id="errBanner" class="hidden bg-red-900/60 border-b border-red-700 px-4 py-2 text-xs text-red-100"></div>

<!-- Settings drawer -->
<div id="settingsPanel" class="hidden bg-gray-800 border-b border-gray-700 px-4 py-3 text-sm space-y-3">
  <div class="font-semibold">Display & alerts</div>
  <label class="flex items-center justify-between gap-3">
    <span>Show pairs with spread ≥</span>
    <span class="flex items-center gap-1">
      <input id="setMinSpread" type="number" step="0.1" min="-10" max="20"
             class="bg-gray-900 border border-gray-700 rounded px-2 py-1 w-20 num text-right" />
      <span>¢</span>
    </span>
  </label>
  <label class="flex items-center justify-between gap-3">
    <span>Default contracts per execution</span>
    <input id="setContracts" type="number" step="1" min="1" max="10000"
           class="bg-gray-900 border border-gray-700 rounded px-2 py-1 w-20 num text-right" />
  </label>
  <div class="text-[10px] text-gray-500">
    Push alerts (ntfy) are configured server-side via env vars
    (<code>NTFY_TOPIC</code>, <code>NTFY_ARB_SPREAD_C</code>). The threshold
    above only filters what's shown in the UI.
  </div>
  <div class="flex flex-wrap gap-2">
    <button id="testNtfyBtn" class="flex-1 bg-amber-700 active:bg-amber-800 py-2 rounded text-xs">Send ntfy test push</button>
  </div>
  <div id="ntfyStatus" class="text-[11px] text-gray-400"></div>
  <div id="healthDump" class="text-[10px] text-gray-500 font-mono whitespace-pre-wrap"></div>
</div>

<nav class="sticky top-[57px] z-20 bg-gray-900/95 backdrop-blur border-b border-gray-800 flex text-sm">
  <button data-tab="opps" class="tab flex-1 py-3 border-b-2 border-green-500 text-green-400">Opportunities</button>
  <button data-tab="pos"  class="tab flex-1 py-3 border-b-2 border-transparent text-gray-400">Positions</button>
  <button data-tab="all"  class="tab flex-1 py-3 border-b-2 border-transparent text-gray-400">All Pairs</button>
</nav>

<section id="tab-opps" class="px-3 pt-3">
  <div id="oppsList" class="space-y-2">
    <div class="text-gray-500 text-sm py-8 text-center">Loading scan…</div>
  </div>
</section>

<section id="tab-pos" class="px-3 pt-3 hidden">
  <div id="balanceGrid" class="grid grid-cols-2 gap-2 mb-3 text-xs"></div>
  <div id="posList" class="space-y-2">
    <div class="text-gray-500 text-sm py-8 text-center">Loading positions…</div>
  </div>
</section>

<section id="tab-all" class="px-3 pt-3 hidden">
  <div id="allList" class="rounded overflow-hidden bg-gray-800/40 divide-y divide-gray-800 text-xs num"></div>
</section>

<!-- Execute Modal -->
<div id="modal" class="fixed inset-0 bg-black/80 z-50 hidden items-end sm:items-center justify-center px-3">
  <div class="bg-gray-800 rounded-t-2xl sm:rounded-2xl w-full max-w-md p-5 mb-0">
    <div class="flex justify-between items-start mb-3">
      <h3 id="modalTitle" class="text-lg font-bold">Execute arb</h3>
      <button onclick="closeModal()" class="text-gray-400 text-2xl leading-none">&times;</button>
    </div>
    <div id="modalBody" class="space-y-3 text-sm"></div>
    <div id="modalResult" class="mt-3 text-sm"></div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeModal()" class="flex-1 bg-gray-700 active:bg-gray-600 py-3 rounded font-medium">Close</button>
      <button id="modalQuoteBtn" class="flex-1 bg-blue-600 active:bg-blue-700 py-3 rounded font-medium">Quote</button>
      <button id="modalConfirmBtn" class="flex-1 bg-green-600 active:bg-green-700 py-3 rounded font-medium hidden">Execute</button>
    </div>
  </div>
</div>

<script>
let scanData = null;
let positionsData = null;
let currentIntent = null;
let currentToken = null;
let maxOrderUsd = 50;
let lastHealth = null;
let dryRun = true;
const settings = {
  minSpreadC: -5.0,
  contracts: 100,
};

// ---- utility -------------------------------------------------------------

function updateClock() {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

function fmtC(c, signed) {
  if (c == null) return '—';
  const sign = (signed && c > 0) ? '+' : '';
  return `${sign}${c.toFixed(2)}¢`;
}
function fmtPrice(p) {
  if (p == null) return '—';
  return `${(p * 100).toFixed(1)}¢`;
}
function fmtUsd(d) {
  if (d == null) return '—';
  const sign = d < 0 ? '-$' : '$';
  return `${sign}${Math.abs(d).toFixed(2)}`;
}
function setStatus(text, color) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = color || 'text-gray-400';
}
function showError(text) {
  const el = document.getElementById('errBanner');
  if (!text) { el.classList.add('hidden'); el.textContent = ''; return; }
  el.classList.remove('hidden');
  el.textContent = text;
}

// ---- settings persistence ------------------------------------------------

function loadSettings() {
  try {
    Object.assign(settings, JSON.parse(localStorage.getItem('arb_settings') || '{}'));
  } catch {}
  document.getElementById('setMinSpread').value = settings.minSpreadC;
  document.getElementById('setContracts').value = settings.contracts;
}
function saveSettings() {
  settings.minSpreadC = parseFloat(document.getElementById('setMinSpread').value);
  settings.contracts  = parseInt(document.getElementById('setContracts').value, 10) || 100;
  localStorage.setItem('arb_settings', JSON.stringify(settings));
}

// ---- fetch helpers -------------------------------------------------------

async function api(path, init) {
  const res = await fetch(path, init);
  if (!res.ok) {
    const text = await res.text();
    throw new Error(`${res.status} ${res.statusText}: ${text}`);
  }
  return res.json();
}

async function refreshHealth() {
  try {
    const h = await api('/health');
    lastHealth = h;
    maxOrderUsd = h.max_order_usd || 50;
    dryRun = !!h.dry_run;
    document.getElementById('dryRunBadge').classList.toggle('hidden', !h.dry_run);
    document.getElementById('healthDump').textContent = JSON.stringify(h, null, 2);
  } catch (e) {
    showError(`health: ${e.message}`);
  }
}

// ---- scan / opportunities ------------------------------------------------

async function refreshScan() {
  setStatus('Scanning…', 'text-blue-300');
  try {
    const data = await api(`/api/scan?contracts=${settings.contracts}&min_spread=${settings.minSpreadC}`);
    scanData = data;
    renderOpps();
    renderAll();
    const pos = data.rows.filter(r => r.locked_spread_cents > 0).length;
    setStatus(`${data.pairs.length} pairs, ${pos} positive arbs`, 'text-gray-300');
    if (data.errors && data.errors.length) {
      showError(data.errors.join(' | '));
    } else {
      showError('');
    }
  } catch (e) {
    setStatus('Error', 'text-red-400');
    showError(`scan: ${e.message}`);
  }
}

function legCard(leg, label) {
  const venueColor = leg.venue === 'kalshi'
    ? 'border-l-blue-500 bg-blue-900/20'
    : 'border-l-fuchsia-500 bg-fuchsia-900/20';
  return `
    <div class="border-l-4 ${venueColor} rounded p-2 space-y-1">
      <div class="text-[10px] uppercase tracking-wider text-gray-400">${label}</div>
      <div class="text-xs font-mono truncate text-gray-300">${leg.market_id}</div>
      <div class="flex items-baseline justify-between">
        <span class="text-sm font-bold ${leg.side === 'yes' ? 'text-emerald-300' : 'text-rose-300'}">
          ${leg.side.toUpperCase()}
        </span>
        <span class="text-base font-bold num">${fmtPrice(leg.price)}</span>
      </div>
      <div class="text-[10px] text-gray-500 num">fee ${fmtC(leg.fee_cents)}</div>
    </div>`;
}

function oppCard(row) {
  const positive = row.locked_spread_cents > 0;
  const spreadColor = positive
    ? 'text-emerald-400'
    : (row.locked_spread_cents > -1 ? 'text-amber-400' : 'text-gray-500');
  const totalLocked = (row.locked_spread / 100) * settings.contracts;  // $ at default size
  const ringColor = positive ? 'ring-emerald-700' : 'ring-gray-700';
  return `
    <div class="bg-gray-800 rounded-lg p-3 ring-1 ${ringColor}">
      <div class="flex items-baseline justify-between mb-2">
        <div class="min-w-0">
          <div class="text-sm font-semibold truncate">${row.label}</div>
          <div class="text-[10px] text-gray-500 num">${row.pair_key} · dir ${row.direction}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-xl font-bold ${spreadColor} num">${fmtC(row.locked_spread_cents, true)}</div>
          <div class="text-[10px] text-gray-500">/ contract</div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        ${legCard(row.kalshi_leg, 'Kalshi')}
        ${legCard(row.poly_leg, 'Polymarket US')}
      </div>
      <div class="flex items-center justify-between mt-3 text-xs">
        <div class="text-gray-400 num">
          cost ${(row.cost_per_contract * 100).toFixed(2)}¢ · fees ${row.fees_total_cents.toFixed(2)}¢
        </div>
        <button class="bg-green-700 active:bg-green-800 text-white text-xs font-bold px-3 py-1.5 rounded ${positive ? '' : 'opacity-60'}"
                ${positive ? '' : 'disabled'}
                onclick='openExecute(${JSON.stringify(row).replace(/'/g, "\\u0027")})'>
          ${positive ? 'Execute' : 'No arb'}
        </button>
      </div>
    </div>`;
}

function renderOpps() {
  const el = document.getElementById('oppsList');
  const rows = (scanData?.rows || []).filter(r => r.locked_spread_cents >= settings.minSpreadC);
  if (rows.length === 0) {
    el.innerHTML = `
      <div class="text-gray-500 text-sm py-8 text-center">
        No opportunities at or above ${settings.minSpreadC.toFixed(2)}¢/contract.
        ${(scanData?.pairs?.length || 0) === 0
          ? '<br><br>Add pairs to <code>markets.yaml</code> on the server.'
          : ''}
      </div>`;
    return;
  }
  el.innerHTML = rows.map(oppCard).join('');
}

function renderAll() {
  const el = document.getElementById('allList');
  const rows = (scanData?.rows || []);
  if (rows.length === 0) {
    el.innerHTML = `<div class="text-gray-500 text-sm py-8 text-center">No data.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="grid grid-cols-12 gap-2 px-3 py-2 bg-gray-900/60 text-[10px] uppercase tracking-wider text-gray-500">
      <div class="col-span-5">Pair</div>
      <div class="col-span-1 text-center">Dir</div>
      <div class="col-span-2 text-right">Kalshi</div>
      <div class="col-span-2 text-right">Poly</div>
      <div class="col-span-2 text-right">Spread</div>
    </div>
    ${rows.map(r => `
      <div class="grid grid-cols-12 gap-2 px-3 py-2 hover:bg-gray-800/50">
        <div class="col-span-5 truncate">${r.label}</div>
        <div class="col-span-1 text-center text-gray-400">${r.direction}</div>
        <div class="col-span-2 text-right">${r.kalshi_leg.side.toUpperCase()} ${fmtPrice(r.kalshi_leg.price)}</div>
        <div class="col-span-2 text-right">${r.poly_leg.side.toUpperCase()} ${fmtPrice(r.poly_leg.price)}</div>
        <div class="col-span-2 text-right ${r.locked_spread_cents > 0 ? 'text-emerald-400' : 'text-gray-500'}">${fmtC(r.locked_spread_cents, true)}</div>
      </div>
    `).join('')}`;
}

// ---- positions -----------------------------------------------------------

async function refreshPositions() {
  try {
    const data = await api('/api/positions');
    positionsData = data;
    renderPositions();
  } catch (e) {
    document.getElementById('posList').innerHTML =
      `<div class="text-red-400 text-sm py-4 text-center">positions: ${e.message}</div>`;
  }
}

function renderPositions() {
  const grid = document.getElementById('balanceGrid');
  if (!positionsData) {
    grid.innerHTML = ''; return;
  }
  const k = positionsData.kalshi_connected;
  const p = positionsData.polymarket_us_connected;
  const pm = positionsData.polymarket_us || {};
  grid.innerHTML = `
    <div class="bg-blue-900/30 border border-blue-700 rounded p-2">
      <div class="text-[10px] uppercase text-blue-300">Kalshi</div>
      <div class="text-sm">${k ? 'connected' : '<span class="text-red-400">not configured</span>'}</div>
      ${k ? `<div class="num text-[11px] text-gray-300 mt-1">cash ${fmtUsd(positionsData.kalshi_cash_dollars)} · pv ${fmtUsd(positionsData.kalshi_portfolio_value_dollars)}</div>` : ''}
    </div>
    <div class="bg-fuchsia-900/30 border border-fuchsia-700 rounded p-2">
      <div class="text-[10px] uppercase text-fuchsia-300">Polymarket US</div>
      <div class="text-sm">${p ? 'connected' : '<span class="text-red-400">not configured</span>'}</div>
      ${p ? `<div class="num text-[11px] text-gray-300 mt-1">cash ${fmtUsd(pm.cash_dollars)} · pv ${fmtUsd(pm.portfolio_value_dollars)}</div>
             <div class="num text-[10px] text-gray-500">buying power ${fmtUsd(pm.buying_power_dollars)}</div>` : ''}
    </div>`;

  const el = document.getElementById('posList');
  const pairs = positionsData.pairs || [];
  const held = pairs.filter(r => Math.abs(r.kalshi.shares) > 0 || Math.abs(r.polymarket.shares) > 0);
  if (held.length === 0) {
    el.innerHTML = `<div class="text-gray-500 text-sm py-8 text-center">No open positions on any registered pair.</div>`;
    return;
  }
  el.innerHTML = held.map(r => `
    <div class="bg-gray-800 rounded-lg p-3">
      <div class="text-sm font-semibold mb-2">${r.label}</div>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="border-l-4 border-l-blue-500 bg-blue-900/20 rounded p-2">
          <div class="text-[10px] uppercase text-gray-400">Kalshi</div>
          <div class="num">${r.kalshi.shares.toFixed(0)} ${r.kalshi.side ? r.kalshi.side.toUpperCase() : ''}</div>
          <div class="text-[10px] text-gray-400 num">exp ${fmtUsd(r.kalshi.exposure_dollars)} · fees ${fmtUsd(r.kalshi.fees_paid_dollars)}</div>
        </div>
        <div class="border-l-4 border-l-fuchsia-500 bg-fuchsia-900/20 rounded p-2">
          <div class="text-[10px] uppercase text-gray-400">Polymarket US</div>
          <div class="num">${r.polymarket.shares.toFixed(0)} ${r.polymarket.side ? r.polymarket.side.toUpperCase() : ''}</div>
          <div class="text-[10px] text-gray-400 num">basis ${fmtUsd(r.polymarket.cost_basis)}</div>
        </div>
      </div>
    </div>
  `).join('');
}

// ---- execute modal -------------------------------------------------------

function openExecute(row) {
  currentIntent = row;
  currentToken = null;
  document.getElementById('modalTitle').textContent = `Execute: ${row.label}`;
  const contracts = settings.contracts;
  const lockedTotal = (row.locked_spread) * contracts;
  document.getElementById('modalBody').innerHTML = `
    <div class="text-xs text-gray-400">Pair <span class="text-white font-mono">${row.pair_key}</span> · dir ${row.direction}</div>
    <div class="grid grid-cols-2 gap-2 text-xs">
      ${legCard(row.kalshi_leg, 'Kalshi leg')}
      ${legCard(row.poly_leg, 'Polymarket leg')}
    </div>
    <div class="bg-gray-900 rounded p-3 space-y-2">
      <label class="flex items-center justify-between gap-3">
        <span>Contracts (per leg)</span>
        <input id="modalContracts" type="number" min="1" max="10000" value="${contracts}"
               class="bg-gray-800 border border-gray-700 rounded px-2 py-1 w-24 num text-right" />
      </label>
      <div class="text-xs text-gray-400 num">
        Combined notional ≈ <span id="modalNotional">${fmtUsd((row.kalshi_leg.price + row.poly_leg.price) * contracts)}</span>
        · MAX ${fmtUsd(maxOrderUsd)}
      </div>
      <div class="text-xs num">
        Locked spread at this size: <span class="text-emerald-300 font-bold" id="modalLocked">${fmtUsd(lockedTotal)}</span>
      </div>
      ${dryRun ? '<div class="text-[11px] text-amber-300">DRY-RUN: server will not place real orders.</div>' : ''}
    </div>`;
  document.getElementById('modalResult').innerHTML = '';
  document.getElementById('modalConfirmBtn').classList.add('hidden');
  document.getElementById('modalQuoteBtn').classList.remove('hidden');
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');
  document.getElementById('modalContracts').addEventListener('input', (e) => {
    const n = parseInt(e.target.value, 10) || 0;
    document.getElementById('modalNotional').textContent =
      fmtUsd((row.kalshi_leg.price + row.poly_leg.price) * n);
    document.getElementById('modalLocked').textContent =
      fmtUsd(row.locked_spread * n);
  });
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal').classList.remove('flex');
  currentIntent = null;
  currentToken = null;
}

async function doQuote(allowOverCap) {
  if (!currentIntent) return;
  const contracts = parseInt(document.getElementById('modalContracts').value, 10) || 0;
  if (!contracts) return;
  const resEl = document.getElementById('modalResult');
  resEl.innerHTML = '<div class="text-gray-400">Quoting…</div>';
  try {
    const body = JSON.stringify({
      pair_key: currentIntent.pair_key,
      direction: currentIntent.direction,
      contracts,
      allow_over_cap: !!allowOverCap,
    });
    const data = await api('/api/arb/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
    });
    currentToken = data.token;
    resEl.innerHTML = `
      <div class="bg-gray-900 rounded p-3 text-xs space-y-1">
        <div>Notional <b class="num">${fmtUsd(data.notional_dollars)}</b>${data.over_cap ? ' <span class="text-amber-400">(over cap)</span>' : ''}</div>
        <div class="text-gray-500">Token valid for 60s. Tap <b>Execute</b> to fire both legs.</div>
      </div>`;
    document.getElementById('modalQuoteBtn').classList.add('hidden');
    document.getElementById('modalConfirmBtn').classList.remove('hidden');
  } catch (e) {
    const msg = e.message || '';
    if (msg.includes('exceeds MAX_ORDER_USD') && !allowOverCap) {
      resEl.innerHTML = `
        <div class="bg-amber-900/40 border border-amber-700 rounded p-3 text-xs space-y-2">
          <div class="text-amber-200">${msg}</div>
          <button id="overCapBtn" class="bg-amber-700 active:bg-amber-800 text-xs font-bold px-3 py-2 rounded w-full">
            Override cap and re-quote
          </button>
        </div>`;
      document.getElementById('overCapBtn').addEventListener('click', () => doQuote(true));
    } else {
      resEl.innerHTML = `<div class="text-red-400 text-xs">${msg}</div>`;
    }
  }
}

async function doExecute() {
  if (!currentToken) return;
  const resEl = document.getElementById('modalResult');
  resEl.innerHTML = '<div class="text-gray-400">Executing…</div>';
  try {
    const data = await api('/api/arb/execute', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: currentToken }),
    });
    const r = data.result;
    const statusColor = ({
      success: 'text-emerald-300',
      partial_success: 'text-amber-300',
      hedged: 'text-amber-300',
      unwound: 'text-amber-300',
      naked: 'text-red-300',
      failed: 'text-red-300',
      dry_run: 'text-blue-300',
    })[r.status] || 'text-gray-300';
    const nakedBanner = r.naked_exposure ? `
      <div class="bg-red-700 border-2 border-red-400 rounded p-2 mt-2 animate-pulse">
        <div class="text-white font-bold text-sm">⚠ UNHEDGED EXPOSURE</div>
        <div class="text-red-100 text-xs mt-1 num">
          ${r.naked_exposure.shares.toFixed(0)} ${r.naked_exposure.side.toUpperCase()} on ${r.naked_exposure.venue}
          (${r.naked_exposure.market_id})
        </div>
        <div class="text-red-100 text-[11px] mt-1">${r.naked_exposure.instruction}</div>
      </div>` : '';
    resEl.innerHTML = `
      <div class="bg-gray-900 rounded p-3 text-xs space-y-1">
        <div class="font-bold ${statusColor}">${r.status.toUpperCase()}${data.dry_run ? ' (DRY-RUN)' : ''}</div>
        <div class="num">matched ${r.matched_contracts.toFixed(0)} / ${r.requested_contracts}</div>
        ${r.locked_spread_per_contract != null ? `<div class="num">locked ${(r.locked_spread_per_contract * 100).toFixed(2)}¢/contract · realized ${fmtUsd(r.realized_pl)}</div>` : ''}
        ${(r.notes && r.notes.length) ? r.notes.map(n => `<div class="${r.status === 'naked' ? 'text-red-300 font-bold' : 'text-gray-400'}">• ${n}</div>`).join('') : ''}
        ${nakedBanner}
        <details class="mt-2 text-[10px] text-gray-500">
          <summary class="cursor-pointer">Legs</summary>
          <pre class="whitespace-pre-wrap mt-1">${JSON.stringify(r, null, 2)}</pre>
        </details>
      </div>`;
    document.getElementById('modalConfirmBtn').classList.add('hidden');
    refreshPositions();
  } catch (e) {
    resEl.innerHTML = `<div class="text-red-400 text-xs">${e.message}</div>`;
  }
}

// ---- tab nav -------------------------------------------------------------

function activateTab(name) {
  document.querySelectorAll('.tab').forEach(b => {
    const active = b.dataset.tab === name;
    b.classList.toggle('border-green-500', active);
    b.classList.toggle('text-green-400', active);
    b.classList.toggle('border-transparent', !active);
    b.classList.toggle('text-gray-400', !active);
  });
  document.getElementById('tab-opps').classList.toggle('hidden', name !== 'opps');
  document.getElementById('tab-pos').classList.toggle('hidden', name !== 'pos');
  document.getElementById('tab-all').classList.toggle('hidden', name !== 'all');
  if (name === 'pos') refreshPositions();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => activateTab(b.dataset.tab)));

// ---- wiring --------------------------------------------------------------

document.getElementById('refreshBtn').addEventListener('click', () => {
  refreshScan();
  refreshPositions();
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  const p = document.getElementById('settingsPanel');
  const wasHidden = p.classList.contains('hidden');
  p.classList.toggle('hidden');
  if (!wasHidden) saveSettings();
});

document.getElementById('setMinSpread').addEventListener('change', () => {
  saveSettings();
  refreshScan();
});
document.getElementById('setContracts').addEventListener('change', () => {
  saveSettings();
  refreshScan();
});

document.getElementById('testNtfyBtn').addEventListener('click', async () => {
  const el = document.getElementById('ntfyStatus');
  el.textContent = 'sending…';
  try {
    const r = await api('/api/ntfy/test', { method: 'POST' });
    el.textContent = `OK: ${r.server}`;
  } catch (e) { el.textContent = `error: ${e.message}`; }
});

document.getElementById('modalQuoteBtn').addEventListener('click', () => doQuote(false));
document.getElementById('modalConfirmBtn').addEventListener('click', doExecute);

(async function init() {
  loadSettings();
  await refreshHealth();
  await refreshScan();
  setInterval(refreshScan, 30_000);   // light auto-refresh
  setInterval(refreshHealth, 60_000);
})();
</script>
</body>
</html>
