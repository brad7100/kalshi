<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eurovision EV">
<meta name="theme-color" content="#111827">
<title>Eurovision EV</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  .num { font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen pb-24">

<header class="sticky top-0 z-30 bg-gray-800/95 backdrop-blur border-b border-gray-700 px-4 py-3 flex items-center justify-between">
  <div>
    <div class="text-sm font-semibold">Eurovision 2026 EV</div>
    <div id="status" class="text-[11px] text-gray-400 num">Loading...</div>
  </div>
  <div class="flex items-center gap-2">
    <span id="dryRunBadge" class="hidden text-[10px] font-bold bg-yellow-600 text-black px-2 py-1 rounded">DRY-RUN</span>
    <button id="settingsBtn" class="bg-gray-700 active:bg-gray-600 px-3 py-2 rounded text-sm">⚙</button>
    <button id="refreshBtn" class="bg-blue-600 active:bg-blue-700 px-3 py-2 rounded text-sm font-medium">↻</button>
  </div>
</header>

<!-- Toasts (alerts) — anchored to the BOTTOM so they never overlap the
     sticky header or the tab nav. Padded above iPhone home indicator. -->
<div id="toasts"
     class="fixed bottom-6 left-2 right-2 z-40 space-y-2 pointer-events-none flex flex-col"
     style="padding-bottom: env(safe-area-inset-bottom, 0px);"></div>

<!-- Settings drawer -->
<div id="settingsPanel" class="hidden bg-gray-800 border-b border-gray-700 px-4 py-3 text-sm space-y-3">
  <div class="font-semibold">Alert settings</div>
  <label class="flex items-center justify-between gap-3">
    <span>Buy alert when EV/$ ≥</span>
    <span class="flex items-center gap-1">
      <input id="setBuyEV" type="number" step="0.1" min="0" max="20" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 w-20 num text-right" />
      <span>%</span>
    </span>
  </label>
  <label class="flex items-center justify-between gap-3">
    <span>Sell alert when bid − fair ≥</span>
    <span class="flex items-center gap-1">
      <input id="setSellC" type="number" step="0.1" min="0" max="20" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 w-20 num text-right" />
      <span>¢</span>
    </span>
  </label>
  <label class="flex items-center justify-between gap-3">
    <span>Min refire gap (same opportunity)</span>
    <span class="flex items-center gap-1">
      <input id="setCooldown" type="number" step="60" min="60" max="3600" class="bg-gray-900 border border-gray-700 rounded px-2 py-1 w-20 num text-right" />
      <span>s</span>
    </span>
  </label>
  <div class="text-[10px] text-gray-500">Alerts fire on threshold *crossings* only — they stay silent while the condition keeps holding. This gap is a safety net against noise.</div>
  <label class="flex items-center justify-between gap-3">
    <span>Play sound</span>
    <input id="setSound" type="checkbox" class="w-5 h-5" />
  </label>
  <label class="flex items-center justify-between gap-3">
    <span>Vibrate</span>
    <input id="setVibrate" type="checkbox" class="w-5 h-5" />
  </label>
  <div class="flex flex-wrap gap-2 pt-1">
    <button id="testAlertBtn" class="flex-1 bg-blue-700 active:bg-blue-800 py-2 rounded text-xs">Test alert</button>
    <button id="enableNotifBtn" class="flex-1 bg-purple-700 active:bg-purple-800 py-2 rounded text-xs">Enable system notifications</button>
  </div>
  <div class="flex flex-wrap gap-2">
    <button id="testNtfyBtn" class="flex-1 bg-amber-700 active:bg-amber-800 py-2 rounded text-xs">Send ntfy test push</button>
    <button id="resetMutesBtn" class="flex-1 bg-gray-600 active:bg-gray-500 py-2 rounded text-xs">Reset muted alerts</button>
  </div>
  <div id="muteCount" class="text-[11px] text-gray-400"></div>
  <div id="notifStatus" class="text-[11px] text-gray-400"></div>
  <div id="ntfyStatus" class="text-[11px] text-gray-400"></div>
</div>

<nav class="sticky top-[57px] z-20 bg-gray-900/95 backdrop-blur border-b border-gray-800 flex text-sm">
  <button data-tab="ev"  class="tab flex-1 py-3 border-b-2 border-green-500 text-green-400">+EV</button>
  <button data-tab="pos" class="tab flex-1 py-3 border-b-2 border-transparent text-gray-400">Positions</button>
  <button data-tab="all" class="tab flex-1 py-3 border-b-2 border-transparent text-gray-400">All</button>
</nav>

<section id="tab-ev" class="px-3 pt-3">
  <div id="evList" class="space-y-2">
    <div class="text-gray-500 text-sm py-8 text-center">Loading scan...</div>
  </div>
</section>

<section id="tab-pos" class="px-3 pt-3 hidden">
  <div id="balance" class="text-xs text-gray-400 mb-3"></div>
  <div id="posList" class="space-y-2">
    <div class="text-gray-500 text-sm py-8 text-center">Loading positions...</div>
  </div>
</section>

<section id="tab-all" class="px-3 pt-3 hidden">
  <div id="allList" class="rounded overflow-hidden bg-gray-800/40 divide-y divide-gray-800 text-xs num"></div>
</section>

<!-- Order Modal -->
<div id="modal" class="fixed inset-0 bg-black/80 z-50 hidden items-end sm:items-center justify-center px-3">
  <div class="bg-gray-800 rounded-t-2xl sm:rounded-2xl w-full max-w-md p-5 mb-0">
    <div class="flex justify-between items-start mb-3">
      <h3 id="modalTitle" class="text-lg font-bold">Order</h3>
      <button onclick="closeModal()" class="text-gray-400 text-2xl leading-none">&times;</button>
    </div>
    <div id="modalBody" class="space-y-3 text-sm"></div>
    <div id="modalResult" class="mt-3 text-sm"></div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeModal()" class="flex-1 bg-gray-700 active:bg-gray-600 py-3 rounded font-medium">Close</button>
      <button id="modalQuoteBtn" class="flex-1 bg-blue-600 active:bg-blue-700 py-3 rounded font-medium">Quote</button>
      <button id="modalConfirmBtn" class="flex-1 bg-green-600 active:bg-green-700 py-3 rounded font-medium hidden">Confirm</button>
    </div>
  </div>
</div>

<script>
let scanData = null;
let positionsData = null;
let currentIntent = null;
let currentToken = null;

// ---- Alert engine ---------------------------------------------------------

const settings = {
  buyEvPct: 1.5,        // alert when EV/$ >= this %
  sellEdgeC: 1.0,       // alert when bid - fair >= this many cents
  minRefireSec: 600,    // min seconds between fires of same key (safety net)
  soundOn: true,
  vibrateOn: true,
};
// Rising-edge alert state. For each key:
//   { above: bool — was the trigger condition met on the previous tick?,
//     lastFireAt: number — ms timestamp of last fire }
// An alert only fires on the BELOW->ABOVE transition (plus a min refire
// gap as a safety net for noise around the threshold).
const alertState = {};
let mutedAlerts = new Set();   // keys the user has explicitly silenced
let audioCtx = null;

function loadMutes() {
  try {
    const arr = JSON.parse(localStorage.getItem('ev_muted') || '[]');
    mutedAlerts = new Set(arr);
  } catch { mutedAlerts = new Set(); }
}
function saveMutes() {
  localStorage.setItem('ev_muted', JSON.stringify([...mutedAlerts]));
}
function muteKey(key) {
  mutedAlerts.add(key);
  saveMutes();
}
function resetMutes() {
  mutedAlerts.clear();
  Object.keys(alertState).forEach(k => delete alertState[k]);
  saveMutes();
}

function loadSettings() {
  try {
    Object.assign(settings, JSON.parse(localStorage.getItem('ev_settings') || '{}'));
  } catch {}
  document.getElementById('setBuyEV').value = settings.buyEvPct;
  document.getElementById('setSellC').value = settings.sellEdgeC;
  document.getElementById('setCooldown').value = settings.minRefireSec;
  document.getElementById('setSound').checked = settings.soundOn;
  document.getElementById('setVibrate').checked = settings.vibrateOn;
  updateNotifStatus();
  loadMutes();
}

function saveSettings() {
  settings.buyEvPct = parseFloat(document.getElementById('setBuyEV').value) || 0;
  settings.sellEdgeC = parseFloat(document.getElementById('setSellC').value) || 0;
  settings.minRefireSec = parseInt(document.getElementById('setCooldown').value, 10) || 600;
  settings.soundOn = document.getElementById('setSound').checked;
  settings.vibrateOn = document.getElementById('setVibrate').checked;
  localStorage.setItem('ev_settings', JSON.stringify(settings));
}

function playBeep(kind) {
  if (!settings.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // BUY = rising two-tone, SELL = falling two-tone
    const freqs = kind === 'sell' ? [880, 587] : [587, 880];
    freqs.forEach((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = f;
      const t = audioCtx.currentTime + i * 0.18;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.start(t); o.stop(t + 0.17);
    });
  } catch (e) { /* iOS pre-gesture: silently skip */ }
}

function showToast(message, kind, muteKeyVal) {
  const wrap = document.getElementById('toasts');
  const colors = kind === 'sell'
    ? 'bg-red-900/90 border-red-500 text-red-100'
    : 'bg-green-900/90 border-green-500 text-green-100';
  const el = document.createElement('div');
  el.className = `pointer-events-auto border rounded-lg px-3 py-2 shadow-lg text-sm font-medium ${colors} animate-pulse flex items-start gap-2`;
  el.innerHTML = `
    <div class="flex-1 min-w-0">${message}</div>
    <button class="shrink-0 text-[11px] bg-black/30 active:bg-black/50 px-2 py-1 rounded" data-mute>Mute</button>
    <button class="shrink-0 text-[11px] bg-black/30 active:bg-black/50 px-2 py-1 rounded" data-close>×</button>
  `;
  el.querySelector('[data-mute]').addEventListener('click', () => {
    if (muteKeyVal) muteKey(muteKeyVal);
    el.style.opacity = '0';
    el.style.transition = 'opacity 200ms';
    setTimeout(() => el.remove(), 250);
    updateMuteCount();
  });
  el.querySelector('[data-close]').addEventListener('click', () => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 200ms';
    setTimeout(() => el.remove(), 250);
  });
  wrap.appendChild(el);
  setTimeout(() => { el.classList.remove('animate-pulse'); }, 1200);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 600ms'; }, 12000);
  setTimeout(() => { el.remove(); }, 13000);
}

/**
 * Rising-edge alert. Fires only when the trigger condition newly becomes
 * true (was below threshold last tick, now above), with a safety-net
 * min refire gap. Returns true if it fired.
 *
 *   key           — unique identifier ("KXEUROVISION-26-AUS:yes:buy")
 *   conditionMet  — boolean, is the trigger currently satisfied?
 *   kind          — "buy" or "sell" (color/sound)
 *   title, body   — alert content
 */
function fireAlert(key, conditionMet, kind, title, body) {
  const st = alertState[key] || { above: false, lastFireAt: 0 };
  const now = Date.now();
  if (!conditionMet) {
    st.above = false;
    alertState[key] = st;
    return false;
  }
  if (mutedAlerts.has(key)) {
    st.above = true;  // still track state but never fire
    alertState[key] = st;
    return false;
  }
  // conditionMet=true: only fire on rising edge OR if it's been a long time
  const rising = !st.above;
  const longGap = now - st.lastFireAt > settings.minRefireSec * 1000;
  if (!rising && !longGap) {
    st.above = true;
    alertState[key] = st;
    return false;
  }
  st.above = true;
  st.lastFireAt = now;
  alertState[key] = st;
  playBeep(kind);
  if (settings.vibrateOn && navigator.vibrate) {
    navigator.vibrate(kind === 'sell' ? [120, 80, 120, 80, 120] : [200, 100, 200]);
  }
  showToast(`<b>${title}</b><br><span class="text-xs font-normal opacity-90">${body}</span>`, kind, key);
  if (document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try { new Notification(title, { body, tag: key, renotify: false }); } catch {}
  }
  return true;
}

function updateMuteCount() {
  const el = document.getElementById('muteCount');
  if (!el) return;
  if (mutedAlerts.size === 0) {
    el.textContent = 'No alerts muted.';
  } else {
    el.textContent = `${mutedAlerts.size} alert${mutedAlerts.size === 1 ? '' : 's'} muted.`;
  }
}

function checkAlerts() {
  let fired = 0;
  // BUY: every row in the scan emits a (key, conditionMet) signal. fireAlert
  // tracks edge transitions internally so signals that stay True don't spam.
  for (const r of (scanData?.rows || [])) {
    const evPct = (r.ev_per_dollar || 0) * 100;
    const side = (r.side || 'yes').toUpperCase();
    const key = `${r.ticker}:${r.side || 'yes'}:buy`;
    const conditionMet = evPct >= settings.buyEvPct;
    const title = `BUY ${side} ${r.event_label}: ${r.country} +${evPct.toFixed(1)}% EV`;
    const body = `${side} ask ${(r.kalshi_ask*100).toFixed(0)}¢ vs fair ${(r.true_prob*100).toFixed(0)}¢ (${r.ticker})`;
    if (fireAlert(key, conditionMet, 'buy', title, body)) fired++;
  }
  // SELL: same logic for held positions.
  for (const p of (positionsData?.positions || [])) {
    if (!p.position || p.sell_edge_net_per_contract == null) continue;
    const netEdgeC = p.sell_edge_net_per_contract * 100;
    const side = (p.side || 'yes').toUpperCase();
    const key = `${p.ticker}:${p.side || 'yes'}:sell`;
    const conditionMet = netEdgeC >= settings.sellEdgeC;
    const title = `SELL ${side} ${p.event_label}: ${p.country} +${netEdgeC.toFixed(1)}¢ NET above fair`;
    const body = `${side} bid ${(p.current_yes_bid*100).toFixed(0)}¢ vs fair ${(p.true_prob*100).toFixed(0)}¢, after ${(p.sell_fee_per_contract*100).toFixed(1)}¢ fee — ${Math.abs(p.position)} contracts (${p.ticker})`;
    if (fireAlert(key, conditionMet, 'sell', title, body)) fired++;
  }
  updateMuteCount();
  return fired;
}

function updateNotifStatus() {
  const el = document.getElementById('notifStatus');
  if (!('Notification' in window)) {
    el.textContent = 'System notifications not supported in this browser.';
    return;
  }
  el.textContent = `Notification permission: ${Notification.permission}`;
}

function updateNtfyStatus(health) {
  const el = document.getElementById('ntfyStatus');
  if (!el) return;
  if (health && health.ntfy_configured) {
    el.innerHTML = '<span class="text-green-400">ntfy push: enabled</span> — alerts fire even when this app is closed.';
  } else {
    el.innerHTML = '<span class="text-yellow-400">ntfy push: not configured.</span> Set NTFY_TOPIC in Railway env vars.';
  }
}

async function fetchJSON(url, opts = {}) {
  const res = await fetch(url, opts);
  const ct = res.headers.get('content-type') || '';
  if (!res.ok) {
    let detail = '';
    try { detail = ct.includes('json') ? JSON.stringify(await res.json()) : await res.text(); } catch {}
    throw new Error(`${res.status}: ${detail || res.statusText}`);
  }
  return res.json();
}

async function refresh() {
  setStatus('Refreshing...');
  try {
    const [health, scan, pos] = await Promise.all([
      fetchJSON('/health'),
      fetchJSON('/api/scan?contracts=100&price_side=mid'),
      fetchJSON('/api/positions'),
    ]);
    document.getElementById('dryRunBadge').classList.toggle('hidden', !health.dry_run);
    updateNtfyStatus(health);
    scanData = scan;
    positionsData = pos;
    renderEV();
    renderPositions();
    renderAll();
    const fired = checkAlerts();
    const stamp = 'Updated ' + new Date().toLocaleTimeString();
    setStatus(fired ? `${stamp} • ${fired} alert${fired === 1 ? '' : 's'}` : stamp);
  } catch (e) {
    setStatus('Error: ' + e.message);
  }
}

function setStatus(s) { document.getElementById('status').textContent = s; }

function fmtCents(v) { return v == null ? '-' : (v * 100).toFixed(1) + 'c'; }
function fmtPct(v) { return v == null ? '-' : (v * 100).toFixed(2) + '%'; }

function renderEV() {
  const el = document.getElementById('evList');
  const pos = (scanData?.rows || []).filter(r => r.ev_per_dollar > 0);
  if (!pos.length) {
    el.innerHTML = '<div class="text-gray-500 text-sm py-8 text-center">No +EV signals right now.</div>';
    return;
  }
  el.innerHTML = pos.map(r => {
    const side = (r.side || 'yes').toUpperCase();
    const sideClass = r.side === 'no'
      ? 'text-orange-300 bg-orange-900/40'
      : 'text-emerald-300 bg-emerald-900/40';
    return `
    <div class="bg-green-900/20 border border-green-800 rounded-lg p-3">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-baseline gap-2 flex-wrap">
            <div class="font-bold text-lg">${r.country}</div>
            ${r.event_label ? `<div class="text-[10px] uppercase tracking-wide text-blue-300 bg-blue-900/40 px-2 py-0.5 rounded">${r.event_label}</div>` : ''}
            <div class="text-[10px] uppercase tracking-wide ${sideClass} px-2 py-0.5 rounded">${side}</div>
          </div>
          <div class="text-[11px] text-gray-400 num break-all">${r.ticker}</div>
          <div class="text-xs text-gray-300 mt-1 num">
            ${side} ask <span class="text-white">${fmtCents(r.kalshi_ask)}</span>
            &nbsp;•&nbsp; fair <span class="text-white">${fmtCents(r.true_prob)}</span>
            &nbsp;•&nbsp; fee ${fmtCents(r.fee_per_contract)}
          </div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-green-400 font-bold text-base num">+${fmtPct(r.ev_per_dollar)}</div>
          <button class="mt-1 bg-green-600 active:bg-green-700 text-white text-xs font-bold px-3 py-2 rounded"
                  onclick='openBuy(${JSON.stringify(r).replace(/'/g, "&apos;")})'>BUY ${side}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderPositions() {
  const el = document.getElementById('posList');
  const bal = document.getElementById('balance');
  if (!positionsData) { return; }
  if (!positionsData.connected) {
    bal.textContent = '';
    const reason = positionsData.reason || 'unknown error';
    const looksLikeMissingCreds = /missing|not configured|not set/i.test(reason);
    const hint = looksLikeMissingCreds
      ? 'Set KALSHI_KEY_ID and KALSHI_PRIVATE_KEY in Railway env vars.'
      : 'Credentials are loaded but Kalshi rejected the request. Check the error detail above.';
    el.innerHTML = `<div class="bg-yellow-900/30 border border-yellow-700 rounded p-3 text-yellow-200 text-sm">
      <div class="font-semibold mb-1">Kalshi not connected</div>
      <div class="break-all">${reason}</div>
      <div class="mt-2 text-xs text-yellow-300/80">${hint}</div>
    </div>`;
    return;
  }
  const d = positionsData.debug || {};
  const debugLine = d.kalshi_returned != null
    ? `&nbsp;•&nbsp; <span class="text-gray-500 num">Kalshi sent ${d.kalshi_returned}, showing ${d.shown} (dropped zero=${d.dropped_zero}, non-Eurovision=${d.dropped_non_eurovision})</span>`
    : '';
  bal.innerHTML = `Balance: <span class="text-white font-semibold num">$${(positionsData.balance_dollars || 0).toFixed(2)}</span>${debugLine}`;
  const ps = positionsData.positions || [];
  if (!ps.length) {
    const sampleKeys = (d.sample_position_keys || []).join(', ') || '(no positions returned)';
    el.innerHTML = `<div class="text-sm py-6 px-3 bg-gray-800/60 border border-gray-700 rounded">
      <div class="text-gray-300 mb-2">No open Eurovision positions matched.</div>
      <div class="text-[11px] text-gray-500 num">Kalshi response keys: ${(d.top_level_keys || []).join(', ') || '(none)'}</div>
      <div class="text-[11px] text-gray-500 num mt-1">Sample position fields: ${sampleKeys}</div>
    </div>`;
    return;
  }
  el.innerHTML = ps.map(p => {
    const avgCost = p.avg_cost_cents != null ? p.avg_cost_cents.toFixed(1) + 'c' : '-';
    const recognizedPrice = p.current_yes_ask != null;
    return `
    <div class="bg-gray-800/60 border border-gray-700 rounded-lg p-3">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-baseline gap-2">
            <div class="font-bold">${p.country}</div>
            ${p.event_label ? `<div class="text-[10px] uppercase tracking-wide text-blue-300 bg-blue-900/40 px-2 py-0.5 rounded">${p.event_label}</div>` : ''}
          </div>
          <div class="text-[11px] text-gray-500 num break-all">${p.ticker}</div>
          <div class="text-xs text-gray-300 mt-1 num">
            ${Math.abs(p.position)} contracts ${p.side.toUpperCase()}
            &nbsp;•&nbsp; avg ${avgCost}
            ${recognizedPrice ? `&nbsp;•&nbsp; now ${fmtCents(p.current_yes_ask)}` : '&nbsp;•&nbsp; <span class="text-yellow-400">no price feed</span>'}
            ${p.true_prob != null ? `&nbsp;•&nbsp; fair ${fmtCents(p.true_prob)}` : ''}
          </div>
        </div>
        <div class="text-right shrink-0">
          ${p.ev_per_dollar != null ? `<div class="text-[11px] ${p.ev_per_dollar > 0 ? 'text-green-400' : 'text-gray-400'} num">EV ${fmtPct(p.ev_per_dollar)}</div>` : ''}
          <button class="mt-1 bg-red-600 active:bg-red-700 text-white text-xs font-bold px-3 py-2 rounded ${recognizedPrice ? '' : 'opacity-60'}"
                  onclick='openSell(${JSON.stringify(p).replace(/'/g, "&apos;")})'>SELL</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderAll() {
  const el = document.getElementById('allList');
  const rows = scanData?.rows || [];
  el.innerHTML = rows.map(r => {
    const side = (r.side || 'yes').toUpperCase();
    const sideClass = r.side === 'no'
      ? 'text-orange-300/90 bg-orange-900/30'
      : 'text-emerald-300/90 bg-emerald-900/30';
    return `
    <div class="flex justify-between items-center px-3 py-2">
      <div class="min-w-0">
        <div class="flex items-center gap-2 flex-wrap">
          <span>${r.country}</span>
          ${r.event_label ? `<span class="text-[9px] uppercase tracking-wide text-blue-300/80 bg-blue-900/30 px-1.5 py-0.5 rounded">${r.event_label}</span>` : ''}
          <span class="text-[9px] uppercase tracking-wide ${sideClass} px-1.5 py-0.5 rounded">${side}</span>
        </div>
        <div class="text-[10px] text-gray-500 num">${side} ask ${fmtCents(r.kalshi_ask)} / fair ${fmtCents(r.true_prob)}</div>
      </div>
      <div class="text-right ${r.ev_per_dollar > 0 ? 'text-green-400' : 'text-gray-400'} num">
        ${fmtPct(r.ev_per_dollar)}
      </div>
    </div>`;
  }).join('');
}

// Render a row of $-amount quick-pick buttons. priceCents = limit price in
// cents (1–99). Each button picks `floor(amount * 100 / priceCents)` contracts.
function dollarPickerHtml(priceCents, maxContracts) {
  const amounts = [5, 10, 15, 20, 25, 50, 100];
  const buttons = amounts.map(a => {
    let n = Math.max(1, Math.floor((a * 100) / Math.max(1, priceCents)));
    if (maxContracts != null) n = Math.min(n, maxContracts);
    return `<button type="button" class="dollarBtn bg-gray-700 active:bg-gray-600 text-xs py-2 rounded num"
              data-contracts="${n}">$${a}<br><span class="text-[10px] text-gray-400">${n}c</span></button>`;
  }).join('');
  return `
    <div class="text-[11px] text-gray-400 mt-3">Quick size (at ${priceCents}¢ limit):</div>
    <div class="grid grid-cols-4 gap-2 mt-1">${buttons}</div>
  `;
}

function wireDollarPicker() {
  document.querySelectorAll('.dollarBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const n = parseInt(btn.dataset.contracts, 10);
      const inp = document.getElementById('orderCount');
      if (inp) inp.value = n;
    });
  });
}

function openBuy(row) {
  const side = row.side || 'yes';
  currentIntent = { action: 'buy', side, ticker: row.ticker, country: row.country, count: 100 };
  const priceC = Math.max(1, Math.round((row.kalshi_ask || 0.01) * 100));
  showModal(`BUY ${side.toUpperCase()} — ${row.country} (${row.event_label || ''})`, `
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div>Ticker</div><div class="text-right num">${row.ticker}</div>
      <div>${side.toUpperCase()} ask</div><div class="text-right num">${fmtCents(row.kalshi_ask)}</div>
      <div>Fair P(${side.toUpperCase()})</div><div class="text-right num">${fmtCents(row.true_prob)}</div>
      <div>EV/$</div><div class="text-right num text-green-400">${fmtPct(row.ev_per_dollar)}</div>
    </div>
    <label class="block text-sm mt-2">Contracts
      <input id="orderCount" type="number" value="100" min="1" max="10000"
             class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-2 py-2 text-base num" />
    </label>
    ${dollarPickerHtml(priceC, null)}
  `);
  wireDollarPicker();
}

function openSell(p) {
  currentIntent = {
    action: 'sell', side: p.side === 'no' ? 'no' : 'yes',
    ticker: p.ticker, country: p.country, count: Math.abs(p.position),
  };
  const priceC = Math.max(1, Math.round((p.current_yes_bid || 0.01) * 100));
  const pos = Math.abs(p.position);
  showModal(`SELL ${p.side.toUpperCase()} — ${p.country}`, `
    <div class="grid grid-cols-2 gap-2 text-xs">
      <div>Ticker</div><div class="text-right num">${p.ticker}</div>
      <div>Position</div><div class="text-right num">${pos} ${p.side.toUpperCase()}</div>
      <div>${p.side.toUpperCase()} bid</div><div class="text-right num">${fmtCents(p.current_yes_bid)}</div>
      <div>Fair P(${p.side.toUpperCase()})</div><div class="text-right num">${fmtCents(p.true_prob)}</div>
    </div>
    <label class="block text-sm mt-2">Contracts to sell
      <input id="orderCount" type="number" value="${pos}" min="1" max="${pos}"
             class="w-full mt-1 bg-gray-900 border border-gray-700 rounded px-2 py-2 text-base num" />
    </label>
    ${dollarPickerHtml(priceC, pos)}
    <div class="mt-1"><button type="button" id="sellAllBtn" class="text-xs underline text-gray-400">Sell all ${pos}</button></div>
  `);
  wireDollarPicker();
  document.getElementById('sellAllBtn')?.addEventListener('click', () => {
    const inp = document.getElementById('orderCount');
    if (inp) inp.value = pos;
  });
}

function showModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalResult').innerHTML = '';
  document.getElementById('modalQuoteBtn').classList.remove('hidden');
  document.getElementById('modalConfirmBtn').classList.add('hidden');
  currentToken = null;
  const modal = document.getElementById('modal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  currentIntent = null;
  currentToken = null;
}

document.getElementById('modalQuoteBtn').addEventListener('click', async () => {
  if (!currentIntent) return;
  const qty = parseInt(document.getElementById('orderCount').value, 10);
  if (!qty || qty <= 0) { setResult('Invalid quantity', 'red'); return; }
  setResult('Quoting...', 'yellow');
  try {
    const quote = await fetchJSON('/api/recommend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...currentIntent, count: qty }),
    });
    currentToken = quote.token;
    setResult(`
      <div class="text-xs num">
        Limit: <span class="text-white">${quote.limit_price_cents}c</span> &nbsp;•&nbsp;
        Notional: <span class="text-white">$${quote.notional_dollars.toFixed(2)}</span> &nbsp;•&nbsp;
        Quoted EV/$: <span class="${quote.ev_per_dollar_at_quote > 0 ? 'text-green-400' : 'text-gray-400'}">${fmtPct(quote.ev_per_dollar_at_quote)}</span>
      </div>
      <div class="text-[11px] text-gray-400 mt-1">Token valid for 60s — tap Confirm to fire.</div>
    `, 'gray');
    document.getElementById('modalQuoteBtn').classList.add('hidden');
    document.getElementById('modalConfirmBtn').classList.remove('hidden');
  } catch (e) {
    setResult('Quote failed: ' + e.message, 'red');
  }
});

document.getElementById('modalConfirmBtn').addEventListener('click', async () => {
  if (!currentToken) return;
  document.getElementById('modalConfirmBtn').disabled = true;
  setResult('Submitting...', 'yellow');
  try {
    const out = await fetchJSON('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: currentToken }),
    });
    if (out.dry_run) {
      setResult(`<span class="text-yellow-400 font-bold text-base">${out.message}</span>
        <pre class="text-[10px] text-gray-400 mt-2 overflow-x-auto">${JSON.stringify(out.would_have_sent, null, 2)}</pre>`, 'gray');
    } else {
      setResult(`<span class="text-green-400 font-bold">Order placed.</span>
        <pre class="text-[10px] text-gray-400 mt-2 overflow-x-auto">${JSON.stringify(out.kalshi, null, 2)}</pre>`, 'gray');
      setTimeout(refresh, 1500);
    }
  } catch (e) {
    setResult('Order failed: ' + e.message, 'red');
  } finally {
    document.getElementById('modalConfirmBtn').disabled = false;
    currentToken = null;
    document.getElementById('modalConfirmBtn').classList.add('hidden');
  }
});

function setResult(html, color) {
  const el = document.getElementById('modalResult');
  const colorClass = { red: 'bg-red-900/40 border-red-700', yellow: 'bg-yellow-900/30 border-yellow-700', gray: 'bg-gray-700/40 border-gray-600' }[color] || 'bg-gray-700/40 border-gray-600';
  el.className = 'mt-3 text-sm border rounded p-2 ' + colorClass;
  el.innerHTML = html;
}

// Tabs
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => {
      b.classList.remove('border-green-500', 'text-green-400');
      b.classList.add('border-transparent', 'text-gray-400');
    });
    btn.classList.add('border-green-500', 'text-green-400');
    btn.classList.remove('border-transparent', 'text-gray-400');
    ['ev', 'pos', 'all'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== btn.dataset.tab);
    });
  });
});

document.getElementById('refreshBtn').addEventListener('click', refresh);

// Settings panel wiring
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsPanel').classList.toggle('hidden');
});
['setBuyEV', 'setSellC', 'setCooldown', 'setSound', 'setVibrate'].forEach(id => {
  document.getElementById(id).addEventListener('change', saveSettings);
});
document.getElementById('testAlertBtn').addEventListener('click', () => {
  // Force-clear cooldown for the test key, then fire two alerts.
  delete lastAlertAt['__test:buy'];
  delete lastAlertAt['__test:sell'];
  fireAlert('__test:buy', 'buy', 'BUY test', 'Two-tone rising beep + vibrate.');
  setTimeout(() => fireAlert('__test:sell', 'sell', 'SELL test', 'Two-tone falling beep + longer vibrate.'), 700);
});
document.getElementById('enableNotifBtn').addEventListener('click', async () => {
  if (!('Notification' in window)) { updateNotifStatus(); return; }
  try {
    await Notification.requestPermission();
  } catch {}
  updateNotifStatus();
});

document.getElementById('resetMutesBtn').addEventListener('click', () => {
  resetMutes();
  updateMuteCount();
});

document.getElementById('testNtfyBtn').addEventListener('click', async () => {
  const btn = document.getElementById('testNtfyBtn');
  const el = document.getElementById('ntfyStatus');
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = 'Sending...';
  try {
    const res = await fetch('/api/ntfy/test', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      el.innerHTML = `<span class="text-red-400">ntfy test failed:</span> ${data.detail || res.status}`;
    } else {
      el.innerHTML = `<span class="text-green-400">ntfy test pushed</span> via ${data.server || 'ntfy.sh'}. Check your phone.`;
    }
  } catch (e) {
    el.innerHTML = `<span class="text-red-400">ntfy test error:</span> ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = prev;
  }
});

loadSettings();
refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
