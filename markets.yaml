# Curated pairs of Kalshi <-> Polymarket US markets for arb scanning.
#
# Each pair maps ONE specific Kalshi market ticker to ONE Polymarket US
# market slug. v1 supports binary markets only: each pair has a YES side
# and a NO side on both venues, and we scan for arb where buying YES on
# one venue and NO on the other locks in profit after fees.
#
# Fields:
#   key                 short stable identifier (used in URLs, logs, alerts)
#   label               human-readable name shown in UI / notifications
#   kalshi_ticker       exact Kalshi market ticker (NOT event_ticker — the
#                       specific market, e.g. CONTROLH-2026-D)
#   polymarket_us_slug  exact Polymarket US market slug
#   yes_means           "same" (default) or "inverted". Use "inverted"
#                       when one venue's YES corresponds to the other's NO.
#   enabled             skip a pair without deleting its entry. Default true.
#
# The file is reloaded on every scan, so changes take effect without
# restarting the app.

pairs:
  # 2026 U.S. House midterm — partisan control. Both venues quote two
  # separate single-outcome markets (one for Dem winning, one for Rep
  # winning). Pair each to its same-side counterpart.
  - key: house-2026-dem
    label: 2026 House — Dem wins
    kalshi_ticker: CONTROLH-2026-D
    polymarket_us_slug: paccc-usho-midterms-2026-11-03-dem
    yes_means: same
    enabled: true

  - key: house-2026-rep
    label: 2026 House — Rep wins
    kalshi_ticker: CONTROLH-2026-R
    polymarket_us_slug: paccc-usho-midterms-2026-11-03-rep
    yes_means: same
    enabled: true

  # 2026 U.S. Senate midterm — same structure as House.
  - key: senate-2026-dem
    label: 2026 Senate — Dem wins
    kalshi_ticker: CONTROLS-2026-D
    polymarket_us_slug: paccc-usse-midterms-2026-11-03-dem
    yes_means: same
    enabled: true

  - key: senate-2026-rep
    label: 2026 Senate — Rep wins
    kalshi_ticker: CONTROLS-2026-R
    polymarket_us_slug: paccc-usse-midterms-2026-11-03-rep
    yes_means: same
    enabled: true
